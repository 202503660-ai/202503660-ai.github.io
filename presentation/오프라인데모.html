<!doctype html><html lang="ko"><meta charset="utf-8"><title>TROIKA 오프라인 데모</title><style>body{margin:0;background:#17214c;color:white;font:18px sans-serif}header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 32px}img{display:block;width:100%;height:calc(100vh - 140px);object-fit:contain}footer{text-align:center}button{font:inherit;padding:10px 22px;border:0;border-radius:8px;margin:10px;cursor:pointer}</style><header><strong>TROIKA · 시연 대체 화면</strong><span id="label"></span></header><img id="screen" alt="TROIKA 실제 앱 캡처"><footer><button id="prev">← 이전</button><button id="next">다음 →</button></footer><script>const slides=[['demo-recommendations.png','1 / 3 · 취향별 상권 추천'],['demo-detail.png','2 / 3 · 시립대앞사거리 상세'],['demo-allocation.png','3 / 3 · 스탬프 6개 · 소외도 0.669']];let i=0;function show(n){i=Math.max(0,Math.min(2,n));document.getElementById('screen').src=slides[i][0];document.getElementById('label').textContent=slides[i][1];document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===2;}document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.onkeydown=e=>{if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1);};show(0);</script></html>
